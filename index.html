<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapdash — learn every country in the world</title>
<meta name="description" content="Free, unlimited world geography trainer. All 195 countries, five game modes, adaptive drilling and timed 1v1 races against a friend.">
<meta name="theme-color" content="#0c1017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="Mapdash — learn every country in the world">
<meta property="og:description" content="All 195 countries. Five modes. Race a friend on a timer.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mapdash.pages.dev/">
<meta property="og:site_name" content="Mapdash">
<!-- absolute URL, and a NEW filename: iMessage/WhatsApp/Twitter cache preview
     images hard, so reusing og.png would keep serving the old Terra artwork -->
<meta property="og:image" content="https://mapdash.pages.dev/og-mapdash.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mapdash — World Atlas Trainer">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mapdash.pages.dev/og-mapdash.png">
<style>
:root{
  --bg:#0c1017; --bg2:#121822; --panel:#151c27; --panel2:#1b2431;
  --line:#26303f; --line2:#33404f;
  --ink:#e9edf3; --ink2:#9aa7b8; --ink3:#6b7a8d;
  --sea:#0d1420; --land:#2c3746; --land-h:#3d4b5d; --land-off:#1d242e;
  --border:#75899f; --border-dim:#3e4b5d;
  --amber:#e9b350; --amber-d:#c9932f;
  --good:#41c07a; --good-d:#1f7a4a;
  --bad:#ec6a6a; --bad-d:#a03a3a;
  --blue:#5aa9e6;
  --r:12px;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
::selection{background:var(--amber);color:#111}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#141b26,#101620);
  flex:0 0 auto;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:9px;user-select:none}
.brand b{font-family:var(--serif);font-size:22px;letter-spacing:.5px;font-weight:600}
.brand b i{color:var(--amber);font-style:normal}
.brand span{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.spacer{flex:1}

.tabs{display:flex;gap:3px;background:#161d28;padding:4px;border-radius:11px;border:1px solid var(--line2)}
.tabs button{
  padding:7px 15px;border-radius:8px;font-size:14px;font-weight:600;color:#aeb9c8;
  transition:.15s;white-space:nowrap;letter-spacing:.01em;
}
.tabs button:hover{color:#fff;background:#26313f}
.tabs button.on{background:var(--amber);color:#161009;font-weight:700;
  box-shadow:0 2px 10px rgba(224,178,74,.28)}

.ghost{
  padding:7px 14px;border:1px solid #35414f;border-radius:8px;font-size:13.5px;font-weight:550;
  color:#c3ccd8;background:#161d28;transition:.15s;
}
.ghost:hover{border-color:var(--amber);color:var(--amber);background:#1c242f}

/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#mapwrap{flex:1;position:relative;min-width:0;background:
  radial-gradient(ellipse at 50% 40%, #101b2b 0%, #0a0f18 70%);}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.grat{fill:none;stroke:#1b2c40;stroke-width:.6;vector-effect:non-scaling-stroke}
.frame{fill:none;stroke:#243040;stroke-width:1}
path.c{
  fill:var(--land);stroke:var(--border);stroke-width:.9;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;transition:fill .18s ease;
}
path.c.act{cursor:pointer}
path.c.act.hov{fill:var(--land-h);stroke:#b8c9da;stroke-width:1.4}
path.c.dim{fill:var(--land-off);stroke:var(--border-dim);pointer-events:none}
/* already found this session — stays green for good */
path.c.done{fill:#2e6f4c;stroke:#a8f0c8}
path.c.done.dim{fill:#27573e;stroke:#6fbf92}
/* had to be shown to you — stays marked so the end-of-round map is honest */
path.c.shown{fill:#6d3b3b;stroke:#f0b0b0}
path.c.shown.dim{fill:#542f2f;stroke:#c98f8f}
circle.dot.shown{fill:#c07070}
/* hint layers */
path.c.nbr{fill:#456d95}
path.c.cand{fill:#3f5170;stroke:#8fb3e0;stroke-width:1.1}
path.c.zone{fill:#33445c}
path.c.sel{fill:var(--amber)}
path.c.good{fill:var(--good)}
path.c.bad{fill:var(--bad)}
path.c.hint{fill:#3b4f6b}
path.c.target{fill:var(--amber);stroke:#fff5e0;stroke-width:1.4}
circle.dot{fill:#8b9bb1;stroke:#c3d0de;stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
circle.dot.dim{fill:#38424f;display:none}      /* out-of-scope micro-states: hide instead of cluttering as dead dots */
circle.dot.dim.done,circle.dot.dim.shown{display:block}
circle.dot.done{fill:#4fbf85}
circle.dot.hov{fill:#f0d69a;stroke:#fff;stroke-width:1}
circle.dot.cand{fill:#8fb3e0;stroke:#e8f1fb;stroke-width:1;animation:dotglow 1.3s ease-in-out infinite}
circle.dot.nbr{fill:#456d95}
circle.dot.zone{fill:#33445c}
circle.dot.sel{fill:var(--amber)}
circle.dot.good{fill:var(--good)}
circle.dot.bad{fill:var(--bad)}
circle.dot.hint{fill:#3b4f6b}
circle.dot.target{fill:var(--amber);stroke:#fff5e0;stroke-width:1.2;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dotglow{0%,100%{opacity:1}50%{opacity:.5}}
path.c.target{animation:pulse 1.6s ease-in-out infinite}
circle.hit{fill:none;stroke:none;pointer-events:none}
.lbl{font-size:9px;fill:#cfd8e4;text-anchor:middle;paint-order:stroke;
  stroke:#0b1018;stroke-width:2.5px;stroke-linejoin:round;pointer-events:none;font-family:var(--sans)}
.plabel{font-family:var(--serif);font-size:13px;fill:#fff2d8;text-anchor:middle;paint-order:stroke;
  stroke:#000;stroke-width:3px;stroke-linejoin:round;pointer-events:none}

/* ripple ping */
@keyframes ping{from{r:2;opacity:.9}to{r:26;opacity:0}}
circle.ping{fill:none;stroke-width:2;animation:ping .7s ease-out forwards;pointer-events:none}

/* ---------- floating HUD ---------- */
.hud{
  position:absolute;left:50%;transform:translateX(-50%);top:14px;transition:top .15s;

  background:rgba(19,25,35,.93);backdrop-filter:blur(14px);
  border:1px solid var(--line2);border-radius:14px;
  padding:7px 16px;min-width:0;max-width:min(420px,80%);
  box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:10;
}
.hud .q{font-family:var(--serif);font-size:19px;line-height:1.2;text-align:center;white-space:nowrap}
.hud .q .big{font-size:30px;display:block;line-height:1.05;margin-bottom:0}
.hud .sub{text-align:center;font-size:10.5px;color:var(--ink3);margin-top:1px;letter-spacing:.04em}
.hud .fb{text-align:center;font-size:12px;margin-top:4px;min-height:0;font-weight:500}
.hud .fb:empty{display:none}
.hud .fb.ok{color:var(--good)} .hud .fb.no{color:var(--bad)} .hud .fb.tip{color:var(--amber)}
.hud .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.hud input.type{
  width:100%;min-width:230px;margin-top:6px;padding:7px 11px;border-radius:8px;
  background:#0c121b;border:1px solid var(--line2);color:var(--ink);font-size:15px;
  font-family:var(--serif);text-align:center;outline:none;
}
.hud input.type:focus{border-color:var(--amber)}
.pill{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);color:var(--ink2);transition:.15s}
.pill:hover{border-color:var(--amber);color:var(--amber)}
.pill.solid{background:var(--amber);color:#161009;border-color:var(--amber)}
.pill.solid:hover{background:#f5c163;color:#161009}

/* score strip */
.strip{
  position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:10;
}
.chip{
  background:rgba(19,25,35,.9);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;
}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.chip .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.chip.run{border-color:rgba(224,178,74,.3)}
.chip.run b{font-family:var(--serif);font-size:17px;color:var(--amber);min-width:62px;
  text-align:right;letter-spacing:.01em}
.bar{height:4px;background:#222c39;border-radius:3px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .3s}

/* zoom controls */
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:10}
.zoom button{
  width:34px;height:34px;border-radius:9px;background:rgba(19,25,35,.9);border:1px solid var(--line2);
  color:var(--ink2);font-size:17px;display:grid;place-items:center;backdrop-filter:blur(10px);
}
.zoom button:hover{color:var(--amber);border-color:var(--amber)}

/* hover readout */
.readout{
  position:absolute;left:14px;bottom:14px;z-index:10;
  background:rgba(19,25,35,.92);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:13px;color:var(--ink2);backdrop-filter:blur(10px);
  max-width:280px;display:none;
}
.readout b{color:var(--ink);font-family:var(--serif);font-size:15px}

/* ---------- side panel ---------- */
aside{
  width:342px;flex:0 0 342px;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
aside .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
aside .head h2{font-family:var(--serif);font-size:19px;font-weight:600}
aside .head p{font-size:12.5px;color:var(--ink3);margin-top:2px}
aside .body{flex:1;overflow-y:auto;padding:14px 16px 22px}
aside .body::-webkit-scrollbar{width:9px}
aside .body::-webkit-scrollbar-thumb{background:#2a3542;border-radius:9px;border:2px solid var(--panel)}

.fset{margin-bottom:18px}
.fset>label{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  padding:7px 11px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;
  color:var(--ink2);transition:.14s;
}
.opt:hover{border-color:var(--ink3);color:var(--ink)}
.opt.on{background:var(--amber);border-color:var(--amber);color:#161009;font-weight:650}
.opt small{display:block;font-size:10px;opacity:.7;font-weight:400}

.modecard{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;
  background:var(--panel2);transition:.14s;
}
.modecard:hover{border-color:var(--ink3)}
.modecard.on{border-color:var(--amber);background:#251f12}
.modecard .ic{font-size:19px;line-height:1.1;width:24px;text-align:center;flex:0 0 24px}
.modecard .t{font-weight:650;font-size:13.5px}
.modecard .d{font-size:11.5px;color:var(--ink3);line-height:1.35}

.bigbtn{
  width:100%;padding:12px;border-radius:11px;background:var(--amber);color:#161009;
  font-weight:700;font-size:14.5px;letter-spacing:.01em;transition:.15s;
}
.bigbtn:hover{background:#f6c467}
.bigbtn.sec{background:transparent;border:1px solid var(--line2);color:var(--ink2);font-weight:600}
.bigbtn.sec:hover{border-color:var(--amber);color:var(--amber);background:transparent}

.toggle{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--ink2)}
.sw{width:38px;height:21px;border-radius:12px;background:#2b3543;position:relative;transition:.16s;flex:0 0 38px}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#8d9aac;transition:.16s}
.sw.on{background:var(--amber)} .sw.on::after{left:19.5px;background:#161009}

/* info card */
.info .flag{font-size:52px;line-height:1;text-align:center;margin-bottom:6px}
.info h3{font-family:var(--serif);font-size:24px;text-align:center;line-height:1.15}
.info .off{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:3px;font-style:italic}
.facts{margin-top:14px;border-top:1px solid var(--line);}
.fact{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.fact span{color:var(--ink3);flex:0 0 auto}
.fact b{font-weight:600;text-align:right}
.nbrs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.nbr{font-size:11.5px;padding:4px 8px;border:1px solid var(--line2);border-radius:7px;color:var(--ink2)}
button.nbr:hover{border-color:var(--amber);color:var(--amber)}
/* learn: which stage of the lesson you are in */
.lchip{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);background:rgba(233,179,80,.1);border:1px solid rgba(233,179,80,.3);
  border-radius:7px;padding:5px 10px}

/* lists */
.lst{display:flex;flex-direction:column;gap:1px}
.li{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;width:100%;text-align:left;transition:.12s}
.li:hover{background:var(--panel2)}
.li.on{background:#251f12}
.li .fg{font-size:16px;flex:0 0 auto}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .mv{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mini{width:34px;height:4px;background:#222c39;border-radius:3px;overflow:hidden;flex:0 0 34px}
.mini i{display:block;height:100%;border-radius:3px}

.search{width:100%;padding:9px 11px;border-radius:9px;background:#0c121b;border:1px solid var(--line2);color:var(--ink);outline:none;font-size:13px;margin-bottom:10px}
.search:focus{border-color:var(--amber)}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.stat .v{font-size:23px;font-family:var(--serif);font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:1px}

.regrow{margin-bottom:9px}
.regrow .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.regrow .t span{color:var(--ink2)} .regrow .t b{color:var(--ink);font-variant-numeric:tabular-nums}

.hintbox{background:#141b26;border:1px solid var(--line);border-left:2px solid var(--amber);
  border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.5}

/* results overlay */
.veil{position:absolute;inset:0;background:rgba(8,11,16,.86);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:40;padding:20px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:18px;
  padding:26px 28px;max-width:520px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6);
  max-height:88%;overflow-y:auto}
.card h2{font-family:var(--serif);font-size:28px;text-align:center}
.card .sc{text-align:center;font-family:var(--serif);font-size:62px;line-height:1.05;margin:6px 0 0}
.card .scl{text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:18px}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.miss span{font-size:12px;padding:4px 9px;background:#2a1b1b;border:1px solid #4a2a2a;color:#f0a5a5;border-radius:7px}

kbd{font-family:var(--mono);font-size:10.5px;background:#0d131c;border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}



/* ================= landing ================= */
body.at-home #tabs{display:none}
body.at-home aside{display:none}
body.at-home .zoom{display:none}
body.at-home .readout{display:none}
.brand{cursor:default}
body:not(.at-home) .brand{cursor:pointer}
body:not(.at-home) .brand:hover b{opacity:.82}

#home{position:absolute;inset:0;z-index:38;display:grid;place-items:center;padding:28px 22px;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 42%,rgba(10,14,21,.34) 0%,rgba(9,12,18,.84) 52%,rgba(8,10,15,.97) 100%)}
.hero{width:100%;max-width:1060px;text-align:center;margin:auto}
.hero .word{font-family:var(--serif);font-size:clamp(56px,8.6vw,132px);line-height:.95;letter-spacing:.02em;font-weight:600}
.hero .word i{color:var(--amber);font-style:normal}
.hero .rule{width:64px;height:2px;background:var(--amber);margin:22px auto 0;opacity:.8}
.hero .tag{font-family:var(--serif);font-size:clamp(19px,2vw,30px);color:var(--ink2);margin-top:20px;line-height:1.35}
.hero .sub{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);margin-top:14px}

.picks{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:46px;text-align:left}
.pick{position:relative;overflow:hidden;text-align:left;
  background:linear-gradient(158deg,rgba(32,42,58,.92),rgba(19,26,37,.94));
  border:1px solid var(--line2);border-radius:18px;padding:24px 24px 22px;
  backdrop-filter:blur(10px);transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .18s,box-shadow .18s;
  cursor:pointer;display:flex;flex-direction:column;box-shadow:0 14px 36px rgba(0,0,0,.34)}
.pick::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;opacity:0;transition:opacity .2s;
  background:linear-gradient(90deg,transparent,rgba(233,179,80,.65),transparent)}
.pick::after{content:'';position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,179,80,.10),transparent 65%);opacity:0;transition:opacity .25s}
.pick:hover::before,.pick:hover::after{opacity:1}
.pick:hover{border-color:rgba(233,179,80,.55);transform:translateY(-4px);box-shadow:0 28px 64px rgba(0,0,0,.5)}
.pick .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--amber);
  background:rgba(233,179,80,.09);border:1px solid rgba(233,179,80,.20)}
.pick .ic svg{width:23px;height:23px;display:block}
.pick h3{font-family:var(--serif);font-size:27px;margin-top:15px;font-weight:600;letter-spacing:.01em}
.pick p{font-size:14px;color:var(--ink3);line-height:1.55;margin-top:8px;flex:1}
.pick .go{margin-top:20px;font-size:13.5px;font-weight:650;color:var(--amber);display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.pick .go span{transition:.16s}
.pick:hover .go span{transform:translateX(3px)}

.more{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.more button{padding:11px 18px;border:1px solid var(--line);border-radius:11px;font-size:14px;color:var(--ink2);
  background:rgba(18,24,34,.7);transition:.15s;display:inline-flex;align-items:center;gap:9px}
.more button svg{width:17px;height:17px;opacity:.8}
.more button:hover svg{color:var(--amber);opacity:1}
.more button:hover{border-color:var(--ink3);color:var(--ink)}

.hstat{margin-top:32px;font-size:13px;color:var(--ink3);display:flex;gap:9px;justify-content:center;
  align-items:center;flex-wrap:wrap}
.hstat b{color:var(--ink2);font-weight:600}
.hstat .dot{opacity:.4}
.hbar{width:140px;height:4px;background:#222c39;border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--good);border-radius:3px}

@media (max-width:760px){ .picks{grid-template-columns:1fr;gap:12px} .pick{padding:20px} .pick h3{font-size:24px} }




/* ---------- full-screen solo setup ---------- */
body.picking aside{display:none}
.vcard.wide{max-width:820px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px;text-align:left}
.setupgrid .pick{animation:rise .34s cubic-bezier(.2,.8,.3,1) backwards}
.setupgrid .pick:nth-child(2){animation-delay:.045s}
.setupgrid .pick:nth-child(3){animation-delay:.09s}
.setupgrid .pick:nth-child(4){animation-delay:.135s}
.regiongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.rbtn{padding:14px 8px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(160deg,rgba(30,40,55,.75),rgba(19,26,37,.8));
  text-align:center;transition:.15s}
.rbtn:hover{border-color:var(--ink3);transform:translateY(-1px)}
.rbtn.on{border-color:rgba(233,179,80,.6);background:linear-gradient(160deg,#2b2416,#221c11);
  box-shadow:0 0 0 1px rgba(233,179,80,.15) inset}
.rbtn b{display:block;font-size:14px;color:var(--ink);font-weight:650}
.rbtn.on b{color:var(--amber)}
.rbtn span{font-size:11.5px;color:var(--ink3)}
.rbtn:first-child{grid-column:span 1}
@media (max-width:700px){ .setupgrid{grid-template-columns:1fr} .regiongrid{grid-template-columns:repeat(2,1fr)} }

/* ---------- compact mode picker ---------- */
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink2);
  font-size:12.5px;font-weight:600;transition:.14s}
.mtile:hover{border-color:var(--ink3);color:var(--ink)}
.mtile.on{border-color:var(--amber);background:#251f12;color:var(--amber)}
.mtile svg{width:21px;height:21px}
.mtile:nth-child(5){grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:12px}
.mdesc{font-size:12.5px;color:var(--ink3);margin-top:10px;text-align:center;line-height:1.4}
.tips{margin-top:14px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.9}
.tips button{display:block;margin:6px auto 0;font-size:12.5px;color:var(--ink2);
  border-bottom:1px solid var(--line2);padding-bottom:1px;transition:.15s}
.tips button:hover{color:var(--amber);border-color:var(--amber)}


.sublink{display:block;width:100%;margin-top:18px;text-align:center;font-size:13.5px;color:var(--ink3);transition:.15s}
.sublink:hover{color:var(--amber)}
.summary{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.summary span{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;color:var(--ink2);
  background:rgba(18,24,34,.7)}

/* ---------- sign-up gate ---------- */
.hero.gate{max-width:520px}
.freeline{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--good);
  margin-top:14px;font-weight:600;opacity:.9}
.authbox{margin-top:26px;text-align:left}
.authbox .field{margin-bottom:10px;font-size:15px}
.authbox .bigbtn{margin-top:4px}
.swap{display:block;width:100%;margin-top:14px;font-size:13.5px;color:var(--ink3);transition:.15s}
.swap:hover{color:var(--amber)}
.whyline{font-size:14px;color:var(--ink3);margin-top:6px}
.backlink{position:absolute;top:18px;left:20px;font-size:13.5px;color:var(--ink3);padding:8px 12px;
  border-radius:9px;transition:.15s}
.backlink:hover{color:var(--amber);background:rgba(255,255,255,.04)}

/* ================= leaderboard ================= */
.lbwrap{margin-top:6px}
.lbload{padding:26px 0;text-align:center;color:var(--ink3);font-size:13px}
.lbrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lbrow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);
  transition:.15s}
.lbrow:hover{border-color:var(--line2)}
.lbrank{font-family:var(--serif);font-size:15px;color:var(--ink3);text-align:center;
  font-variant-numeric:tabular-nums}
.lbname{font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbname i{font-style:normal;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#161009;background:var(--amber);border-radius:4px;padding:2px 5px;margin-left:7px;vertical-align:1px}
.lbtime{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}

/* podium — the top three earn a little weight */
.lbrow.m1{background:linear-gradient(96deg,rgba(224,178,74,.16),rgba(224,178,74,.03));border-color:rgba(224,178,74,.42)}
.lbrow.m1 .lbrank,.lbrow.m1 .lbtime{color:var(--amber)}
.lbrow.m2{background:linear-gradient(96deg,rgba(198,208,222,.11),transparent);border-color:rgba(198,208,222,.26)}
.lbrow.m2 .lbrank,.lbrow.m2 .lbtime{color:#c6d0de}
.lbrow.m3{background:linear-gradient(96deg,rgba(196,133,88,.12),transparent);border-color:rgba(196,133,88,.3)}
.lbrow.m3 .lbrank,.lbrow.m3 .lbtime{color:#c48558}
.lbrow.m1 .lbrank::before{content:'●';font-size:8px;vertical-align:3px;margin-right:3px;opacity:.65}
.lbrow.me{outline:1px solid var(--good);outline-offset:-1px}
.lbrow.me .lbname{color:var(--ink)}

/* in-session controls, moved off the map into the sidebar */
.actions{display:flex;gap:8px;margin-bottom:14px}
.act{flex:1;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;
  color:#c3ccd8;background:#161d28;border:1px solid var(--line2);transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.act:hover{border-color:var(--amber);color:var(--amber);background:#1c242f}
.act kbd{font-size:10px;padding:1px 5px}

.lbrule{font-size:13px;color:var(--ink2);padding:7px 11px;background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.lbrule b{color:var(--ink)}

/* full-stage board */
.vcard.board{max-width:760px;width:100%}
.lbtabs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:20px 0 22px}
.lbtab{padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:#aeb9c8;background:#161d28;border:1px solid var(--line2);transition:.15s}
.lbtab:hover{color:#fff;background:#26313f;border-color:#3d4a5a}
.lbtab.on{background:var(--amber);color:#161009;border-color:var(--amber);
  box-shadow:0 2px 12px rgba(224,178,74,.3)}
.lbhead{display:grid;grid-template-columns:52px 1fr auto;gap:14px;padding:0 16px 8px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.lbhead span:last-child{text-align:right}
.lbrows.big{gap:6px}
.lbrows.big .lbrow{grid-template-columns:52px 1fr auto;gap:14px;padding:13px 16px;border-radius:12px}
.lbrows.big .lbrank{font-size:19px}
.lbrows.big .lbname{font-size:16px}
.lbrows.big .lbtime{font-size:23px}
.lbempty{padding:44px 20px;text-align:center;color:var(--ink2);font-size:15px;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.lbempty span{display:block;margin-top:6px;font-size:13px;color:var(--ink3)}

/* the "you did it" flash on the results card */
.lbflash{margin:14px 0 2px;padding:11px 14px;border-radius:11px;text-align:center;
  background:rgba(224,178,74,.09);border:1px solid rgba(224,178,74,.34)}
.lbflash b{display:block;font-family:var(--serif);font-size:19px;color:var(--amber);letter-spacing:.01em}
.lbflash span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.lbflash.pb{background:rgba(65,192,122,.1);border-color:rgba(65,192,122,.4)}
.lbflash.pb b{color:var(--good)}

/* ================= 1v1 ================= */
.stage{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:22px;
  background:radial-gradient(ellipse at 50% 35%,rgba(14,20,30,.86),rgba(8,11,16,.96));backdrop-filter:blur(9px);
  overflow-y:auto}
.stage>*{max-height:none}
.vcard{background:linear-gradient(168deg,rgba(24,31,43,.97),rgba(17,23,32,.98));border:1px solid var(--line2);border-radius:22px;padding:28px 30px;
  width:100%;max-width:520px;box-shadow:0 30px 90px rgba(0,0,0,.65);max-height:92%;overflow-y:auto}
.vcard h2{font-family:var(--serif);font-size:30px;text-align:center;line-height:1.12;letter-spacing:.01em}
.vcard .lede{text-align:center;color:var(--ink3);font-size:13px;margin-top:5px}
.vcard .sect{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:18px 0 7px}

.code{font-family:var(--mono);font-size:34px;letter-spacing:.34em;text-align:center;color:var(--amber);
  background:#0c121b;border:1px dashed var(--line2);border-radius:12px;padding:15px 10px 15px 18px;user-select:all}
.linkrow{display:flex;gap:8px;margin-top:9px}
.linkrow input{flex:1;min-width:0;padding:10px 12px;border-radius:9px;background:#0c121b;
  border:1px solid var(--line2);color:var(--ink2);font-size:12px;font-family:var(--mono);outline:none}

.vsrow{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.pcard{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}
.pcard.me{border-color:var(--amber)}
.pcard.win{border-color:var(--good);background:#15291f}
.pcard .av{width:40px;height:40px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;
  font-size:18px;background:#26303f;font-family:var(--serif)}
.pcard .nm{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sc{font-family:var(--serif);font-size:38px;line-height:1.1;margin-top:2px}
.pcard .st{font-size:11px;color:var(--ink3)}
.vsbadge{font-family:var(--serif);font-size:15px;color:var(--ink3);letter-spacing:.1em;flex:0 0 auto}
.waitdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:6px;
  animation:blip 1.1s infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}

.count{font-family:var(--serif);font-size:120px;line-height:1;text-align:center;color:var(--amber);
  animation:pop .8s ease-out}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

/* live race bar */
.vsbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:8px;align-items:stretch}
.vsbar .box{background:rgba(19,25,35,.93);backdrop-filter:blur(12px);border:1px solid var(--line2);
  border-radius:12px;padding:8px 13px;text-align:center;min-width:96px}
.vsbar .box .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.vsbar .box .v{font-family:var(--serif);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.vsbar .box.clock .v{color:var(--amber)}
.vsbar .box.clock.low .v{color:var(--bad)}
.vsbar .box.lead{border-color:var(--good)}
.vsbar .box.lead .v{color:var(--good)}

.seg{display:flex;gap:6px;background:var(--bg2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 6px;border-radius:7px;font-size:13px;color:var(--ink2);font-weight:550}
.seg button.on{background:var(--amber);color:#161009;font-weight:700}

.field{width:100%;padding:11px 13px;border-radius:10px;background:#0c121b;border:1px solid var(--line2);
  color:var(--ink);font-size:15px;outline:none;margin-bottom:9px}
.field:focus{border-color:var(--amber)}
.err{color:var(--bad);font-size:12.5px;text-align:center;min-height:17px;margin-top:6px}
.muted{color:var(--ink3);font-size:12px;text-align:center;margin-top:12px;line-height:1.5}
.muted a{color:var(--amber)}
.banner{background:#1a2230;border:1px solid var(--line2);border-left:2px solid var(--amber);
  border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:14px;line-height:1.5}
.mobtoggle{display:none}
@media (max-width:900px){
  aside{position:absolute;right:0;top:0;bottom:0;z-index:30;transform:translateX(100%);transition:.22s;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
  aside.open{transform:none}
  .mobtoggle{display:block}
  .hud{min-width:0;width:auto;max-width:92%;padding:7px 13px}
  .hud .q{font-size:19px}
  .brand span{display:none}
}

/* ==================================================================== WARMER
   Hot-or-cold country hunt. Sits over the whole main area, globe on the left,
   the running guess list on the right.                                      */
body.warming #side{display:none}
body.warming .zoom{display:none}
body.warming .readout{display:none}
body.warming #mob{display:none}
#warmer{position:absolute;inset:0;z-index:30;display:none;
  background:radial-gradient(ellipse at 42% 40%,#101b2b 0%,#0a0f18 72%)}
.wm-stage{flex:1;min-width:0;display:flex;padding:14px}
.wm-globe{position:relative;flex:1;min-width:0;min-height:0;touch-action:none;cursor:grab}
.wm-globe.drag{cursor:grabbing}
#wmCv{width:100%;height:100%;display:block}
.wm-tag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:9px;
  align-items:center;padding:8px 15px;background:rgba(21,28,39,.94);border:1px solid var(--line2);
  border-radius:99px;font-size:13.5px;font-weight:650;white-space:nowrap;max-width:94%;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.wm-tag .cap{font-family:var(--mono);font-weight:400;color:var(--ink3);font-size:11.5px}

.wm-side{width:340px;flex:none;border-left:1px solid var(--line);background:var(--bg2);
  display:flex;flex-direction:column;padding:16px;gap:12px;overflow-y:auto}
.wm-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.wm-title h2{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.01em}
.wm-title span{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

.wm-combo{position:relative}
#wmIn{width:100%;padding:12px 13px;border-radius:10px;background:#0c121b;border:1px solid var(--line2);
  color:var(--ink);font-size:15px;outline:none}
#wmIn::placeholder{color:var(--ink3)}
#wmIn:focus{border-color:var(--amber)}
.wm-combo.shake #wmIn{animation:wmshake .32s}
@keyframes wmshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wm-sugg{position:absolute;z-index:44;top:calc(100% + 6px);left:0;right:0;margin:0;padding:5px;
  list-style:none;background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:min(48vh,320px);overflow-y:auto}
.wm-sugg li{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer}
.wm-sugg li[aria-selected="true"]{background:#242f3f}
.wm-sugg .fl{font-size:18px;line-height:1;width:24px;text-align:center;flex:none}
.wm-sugg .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wm-sugg .nm b{color:var(--amber);font-weight:700}
.wm-sugg .rg{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);flex:none}
.wm-sugg .wm-hint{color:var(--ink3);font-size:12.5px;cursor:default;padding:9px}

.wm-msg{min-height:18px;font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.4}
.wm-msg.warn{color:var(--amber)}
.wm-msg.good{color:var(--good);font-weight:600}

.wm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.wm-list li{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent}
.wm-list li:hover{background:var(--panel)}
.wm-list li.win{background:rgba(233,179,80,.1);border-color:rgba(233,179,80,.45)}
.wm-list .sw{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.wm-list .fl{font-size:16px;line-height:1;flex:none}
.wm-list .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wm-list .pc{font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.wm-list .dir{font-size:13px;color:var(--ink3);width:13px;text-align:center;flex:none}
.wm-empty{font-size:12.5px;color:var(--ink3);line-height:1.6}

.wm-legend{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;
  flex-direction:column;gap:6px}
.wm-bar{height:9px;border-radius:99px;
  background:linear-gradient(90deg,#a8c9d8,#e2d6b2 26%,#e9b350 48%,#db7e40 66%,#cd4830 84%,#961c1a)}
.wm-ends{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3)}
.wm-acts{display:flex;gap:7px}
.wm-btn{flex:1;padding:10px 8px;border-radius:10px;font-size:13px;font-weight:650;
  background:var(--amber);color:#161009;border:1px solid var(--amber);transition:.15s}
.wm-btn:hover{filter:brightness(1.07)}
.wm-btn.sec{background:#161d28;color:#c3ccd8;border-color:var(--line2);font-weight:600}
.wm-btn.sec:hover{border-color:var(--amber);color:var(--amber);filter:none}

.wm-opt{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;
  padding:13px 0;border-top:1px solid var(--line);margin-top:4px}
.wm-opt span{display:flex;flex-direction:column;gap:3px}
.wm-opt b{font-size:14px;font-weight:650}
.wm-opt i{font-style:normal;font-size:12px;color:var(--ink3);line-height:1.45}
.wm-opt input{flex:none;width:19px;height:19px;accent-color:var(--amber);margin-top:2px}

.picks{grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
@media (max-width:900px){
  /* the app styles bare <aside> as the sliding map sidebar — opt this one out */
  #warmer{flex-direction:column;overflow-y:auto}
  .wm-stage{flex:none;height:min(50vh,400px);padding:8px}
  .wm-side{position:static;transform:none;box-shadow:none;width:auto;flex:1 0 auto;
    border-left:none;border-top:1px solid var(--line);overflow-y:visible}
  .wm-legend{margin-top:16px}
  /* let the tab strip scroll instead of the whole page */
  #app{overflow-x:hidden}
  header{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  header::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto}
  .spacer{flex:0 0 auto;min-width:6px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="brand" id="brand"><b>MAP<i>DASH</i></b><span>World Atlas Trainer</span></button>
    <div class="tabs" id="tabs">
      <button data-v="play" class="on">Play</button>
      <button data-v="warmer">Warmer</button>
      <button data-v="learn">Learn</button>
      <button data-v="atlas">Atlas</button>
      <button data-v="versus">1v1</button>
      <button data-v="stats">Progress</button>
    </div>
    <div class="spacer"></div>
    <button class="ghost mobtoggle" id="mob">Menu</button>
    <button class="ghost" id="fs">Fullscreen</button>
  </header>
  <main>
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="strip" id="strip"></div>
      <div class="hud" id="hud" style="display:none"></div>
      <div class="readout" id="readout"></div>
      <div class="zoom">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
        <button id="zreset" title="Reset view">⤢</button>
      </div>
      <div class="home" id="home" style="display:none"></div>
      <div class="stage" id="setup" style="display:none"></div>
      <div class="stage" id="stage" style="display:none"></div>
      <div class="vsbar" id="vsbar" style="display:none"></div>
    </div>
    <aside id="side">
      <div class="head"><h2 id="sideTitle">New Session</h2><p id="sideSub">Pick a mode and a region</p></div>
      <div class="body" id="sideBody"></div>
    </aside>
    <div id="warmer"></div>
  </main>
</div>

<script src="data/world-data.js"></script>
<script src="config.js"></script>
<script src="js/warmer.js"></script>
<script src="js/mapdash.js"></script>
</body>
</html>
